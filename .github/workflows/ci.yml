name: CI

on:
  push:
  pull_request:

jobs:
  java:
    name: Engine and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # No wrapper is committed yet, so pin a Gradle version here. Once `gradle wrapper`
      # is run and committed, switch these steps to ./gradlew.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test
        run: gradle test --no-daemon
      - name: Build the server distribution
        run: gradle :server:installDist --no-daemon

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck and build
        run: npm run build
